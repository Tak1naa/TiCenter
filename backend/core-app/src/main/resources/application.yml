spring:
  application:
    name: exam-bank-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/exam_bank?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:32}
      minimum-idle: ${DB_POOL_MIN:4}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: caffeine
    cache-names: file-tree
    caffeine:
      spec: maximumSize=256,recordStats,expireAfterWrite=30s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
server:
  port: ${SERVER_PORT:39180}
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s
app:
  retrieval:
    backend: ${RETRIEVAL_BACKEND:llamaindex}
  intelligence:
    service-url: ${DOCUMENT_INTELLIGENCE_URL:http://document-intelligence:8004}
  exam-bank:
    root-path: ${EXAM_BANK_ROOT:/data/exam-bank}
  exambank-root-path: ${EXAM_BANK_ROOT:/data/exam-bank}
  ocr:
    service-url: ${OCR_SERVICE_URL:http://ocr-service:8001}
    base-url: ${OCR_SERVICE_URL:http://ocr-service:8001}
  embedding:
    service-url: ${EMBEDDING_SERVICE_URL:http://embedding-service:8002}
    model: ${EMBED_MODEL:BAAI/bge-m3}
  llm:
    gateway-url: ${LLM_GATEWAY_URL:http://llm-gateway:8003}
  document-service-url: ${CORE_SELF_URL:http://localhost:39180}
  document:
    service-url: ${CORE_SELF_URL:http://localhost:39180}
  vector:
    service-url: ${CORE_SELF_URL:http://localhost:39180}
  qdrant:
    url: ${QDRANT_URL:http://qdrant:6333}
    collection: ${QDRANT_COLLECTION:exam_chunks_bge_m3_1024_v1}
    api-key: ${QDRANT_API_KEY:}
    dense-dimensions: ${EMBEDDING_DIMENSIONS:1024}
    validate-on-startup: ${QDRANT_VALIDATE_ON_STARTUP:true}
  reranker:
    enabled: ${RERANK_ENABLED:false}
    url: ${RERANK_URL:}
    api-key: ${RERANK_API_KEY:}
    model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    output-count: ${RERANK_OUTPUT_COUNT:8}
  scan:
    enabled: ${SCAN_ENABLED:true}
  parse:
    paused: ${PARSE_PAUSED:false}
    poll-ms: ${PARSE_POLL_MS:1000}
  upload:
    clamav-host: ${CLAMAV_HOST:}
    clamav-port: ${CLAMAV_PORT:3310}
    clamav-required: ${CLAMAV_REQUIRED:false}
  chat:
    max-active: ${CHAT_MAX_ACTIVE:128}
    max-waiting: ${CHAT_MAX_WAITING:512}
    max-wait-seconds: ${CHAT_MAX_WAIT_SECONDS:30}
    provider-max-active: ${CHAT_PROVIDER_MAX_ACTIVE:32}
  rag:
    qdrant-enabled: ${RAG_QDRANT_ENABLED:true}
  prompt:
    context-max-tokens: ${PROMPT_CONTEXT_MAX_TOKENS:5000}
    history-max-tokens: ${PROMPT_HISTORY_MAX_TOKENS:1200}
    question-max-tokens: ${PROMPT_QUESTION_MAX_TOKENS:800}
  session:
    redis-required: ${SESSION_REDIS_REQUIRED:true}
management:
  endpoints.web.exposure.include: health,prometheus,metrics
  endpoint.health.probes.enabled: true
resilience4j:
  circuitbreaker:
    instances:
      embedding: {sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s}
      sparseEmbedding: {sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s}
      qdrant: {sliding-window-size: 20, failure-rate-threshold: 50, wait-duration-in-open-state: 15s}
      reranker: {sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s}
  bulkhead:
    instances:
      embedding: {max-concurrent-calls: 32}
      sparseEmbedding: {max-concurrent-calls: 32}
      qdrant: {max-concurrent-calls: 128}
      reranker: {max-concurrent-calls: 32}
