spring:
  datasource:
    url: jdbc:mysql://localhost:3306/exam_bank?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: exam_bank
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 39181

app:
  exam-bank:
    root-path: ${EXAM_BANK_ROOT:/home/takina/AiQuestionBank/data/exam-bank}
  ocr:
    service-url: http://localhost:8001
  vector:
    service-url: ${VECTOR_SERVICE_URL:http://localhost:39182}
  scan:
    cron: "-"
    enabled: false
