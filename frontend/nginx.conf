# AI 智能题库 - Nginx 配置（生产：静态前端 + 反向代理到各服务）
# 服务间 token：通过 nginx envsubst 模板注入（见 Dockerfile CMD）

server {
    listen 80;
    server_tokens off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    limit_conn connections_per_ip 200;

    # 压缩（文本类资源）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由（SPA 回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 所有反向代理透传真实客户端 IP（Java 侧限流/审计使用）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # Python 服务：注入共享 token（__API_SERVICE_TOKEN__ 由 envsubst 替换）
    # 注意：location 前缀不带尾斜杠，否则匹配不到 /api/render-page?filePath=...（查询串不带路径后缀）
    location /api/render-page {
        proxy_pass http://ocr-service:8001/render-page;
        proxy_set_header X-Api-Token "$API_SERVICE_TOKEN";
        limit_req zone=api_per_ip burst=60 nodelay;
    }
    location /api/count-pages {
        proxy_pass http://ocr-service:8001/count-pages;
        proxy_set_header X-Api-Token "$API_SERVICE_TOKEN";
        limit_req zone=api_per_ip burst=60 nodelay;
    }
    location /api/llm/ {
        proxy_pass http://llm-gateway:8003/;
        proxy_set_header X-Api-Token "$API_SERVICE_TOKEN";
        proxy_buffering off;  # SSE 流式
        proxy_read_timeout 600s;
    }

    # Java 服务（token 由浏览器 X-Student-Token / X-Admin-Token 携带，原样转发）
    location /api/document/ {
        proxy_pass http://core-service:39180/api/document/;
        client_max_body_size 100m;
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_read_timeout 300s;
    }
    location /api/chat/ {
        proxy_pass http://core-service:39180/api/chat/;
        proxy_buffering off;  # SSE 流式
        proxy_read_timeout 600s;
    }
    location /api/quiz/ {
        proxy_pass http://core-service:39180/api/quiz/;
        proxy_read_timeout 300s;  # AI 出题/讲解为同步调用，耗时较长
    }
    location /api/student/ {
        proxy_pass http://core-service:39180/api/student/;
        proxy_read_timeout 300s;
    }
    location /api/admin/ {
        proxy_pass http://core-service:39180/api/admin/;
        proxy_read_timeout 300s;
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'self'";
}
